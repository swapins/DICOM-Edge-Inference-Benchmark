[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-edge-inference-benchmark"
version = "0.1.0"
description = "Reproducible selective DICOM decoding and edge inference benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Swapin Vidya"},
]
dependencies = ["numpy>=1.23", "pydicom>=3.0.1,<4"]

[project.urls]
Repository = "https://github.com/swapins/DICOM-Edge-Inference-Benchmark"
Documentation = "https://github.com/swapins/DICOM-Edge-Inference-Benchmark#readme"

[project.optional-dependencies]
inference = ["torch>=2.0"]
monitoring = ["psutil>=5.9"]
test = ["pytest>=7", "pillow>=9", "pandas>=1.5"]

[project.scripts]
dicom-edge-bench = "dicom_edge_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
